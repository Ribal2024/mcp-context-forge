services:
  nginx:
    ports: !override
      - "9010:80"
    # GD calls ContextForge at http://nginx/... over the shared link network (see networks below).
    networks:
      - mcpnet
      - yahala-mcp-link

  fast_time_server:
    ports: !override
      - "9011:9080"

  postgres:
    restart: unless-stopped
    ports: !override
      - "9112:5432"

  redis:
    restart: unless-stopped
    ports: !override
      - "9113:6379"

  pgbouncer:
    ports: !override
      - "9114:6432"

  migration:
    environment:
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL}

  gateway:
    environment:
      - GUNICORN_WORKERS=2
      - VALIDATION_STRICT=false
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD}
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 1G
    # radio-yahala's MCP servers are reached by service name (2026-10-15: the old host.docker.internal:<port>
    # path through Windows port forwarding hung and cut GD off). Since 2026-11-16 this goes over a small shared
    # network instead of joining the station's whole network: only GD, the station's MCP servers, nginx and
    # gateway are on it, so neither side can reach the other's databases.
    networks:
      - mcpnet
      - yahala-mcp-link

networks:
  # Shared with radio-yahala; owned by neither compose project. Create it once per machine:
  #   docker network create yahala-mcp-link
  yahala-mcp-link:
    external: true
    name: yahala-mcp-link
